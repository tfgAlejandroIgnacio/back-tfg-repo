version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: bbdd_tfg
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: main
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  api:
    build: .
    container_name: api_tfg
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=main
      - DB_USER=usuario
      - DB_PASSWORD=usuario
    volumes:
      - .:/app
    restart: always
